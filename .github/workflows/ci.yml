name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: p6_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p6_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test                 # builds, then API tests (real Postgres) and deploy-plan tests
      - name: Migrations match schema.prisma (no drift)
        working-directory: apps/api
        env: { DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/p6_drift' }
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE p6_drift'
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Generated OpenAPI spec and api-client are current
        run: npm run client:check
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
